{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 rounded-3">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-dark">Welcome Back</h2>
                        <p class="text-muted">Log in to access your workflow dashboard</p>
                    </div>

                    {% if form.errors %}
                        <div class="alert alert-danger role="alert">
                            Invalid username or password. Please try again.
                        </div>
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="id_username" class="form-label text-muted small fw-bold">Username</label>
                            <input type="text" name="username" autofocus required id="id_username" class="form-control form-control-lg bg-light" placeholder="Enter username">
                        </div>

                        <div class="mb-4">
                            <label for="id_password" class="form-label text-muted small fw-bold">Password</label>
                            <input type="password" name="password" required id="id_password" class="form-control form-control-lg bg-light" placeholder="Enter password">
                        </div>

                        <div class="d-grid gap-2 mb-3">
                            <button type="submit" class="btn btn-primary btn-lg shadow-sm">⚡ Secure Log In</button>
                        </div>
                    </form>

                    <div class="text-center mt-4">
                        <p class="mb-0 text-muted small">Don't have an account? <a href="/register/" class="text-primary fw-bold text-decoration-none">Register here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
